name: Build LoggerPro Mac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias e gerar icone .icns
        run: |
          pip install customtkinter psutil pillow pyinstaller
          python -c "from loggerpro import IconFactory; IconFactory.ensure_mac_icns()"

      - name: Compilar LoggerPro.app
        run: |
          pyinstaller --noconsole --windowed --onedir \
            --icon=loggerpro_icon.icns \
            --collect-all customtkinter \
            --collect-all PIL \
            --name "LoggerPro" loggerpro.py

      - name: Aplicar permissoes de execucao e Assinatura Ad-Hoc Apple
        run: |
          chmod -R +x dist/LoggerPro.app/Contents/MacOS/
          codesign --force --deep -s - dist/LoggerPro.app

      - name: Criar instalador nativo .DMG (blindado contra perda de permissao)
        run: |
          hdiutil create -volname "LoggerPro" -srcfolder dist/LoggerPro.app -ov -format UDZO dist/LoggerPro-Installer.dmg

      - name: Disponibilizar Instalador DMG para Download
        uses: actions/upload-artifact@v4
        with:
          name: LoggerPro-macOS-DMG
          path: dist/LoggerPro-Installer.dmg
