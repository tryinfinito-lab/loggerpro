name: Build LoggerPro Mac & Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias e gerar icone .icns
        run: |
          pip install customtkinter psutil pillow pyinstaller
          python -c "from loggerpro import IconFactory; IconFactory.ensure_mac_icns()"

      - name: Compilar LoggerPro.app
        run: |
          pyinstaller --noconsole --windowed --onedir \
            --icon=loggerpro_icon.icns \
            --collect-all customtkinter \
            --name "LoggerPro" loggerpro.py

      - name: Empacotar LoggerPro.app em ZIP
        run: |
          cd dist
          zip -r -y LoggerPro-macOS.zip LoggerPro.app

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: LoggerPro-macOS
          path: dist/LoggerPro-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias e gerar icone .ico
        run: |
          pip install customtkinter psutil pillow pyinstaller
          python -c "from loggerpro import IconFactory; IconFactory.ensure_ico_file()"

      - name: Compilar LoggerPro.exe
        run: |
          pyinstaller --noconsole --onefile \
            --icon=loggerpro_icon.ico \
            --add-data "loggerpro_icon.ico;." \
            --collect-all customtkinter \
            --name "LoggerPro" loggerpro.py

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: LoggerPro-Windows
          path: dist/LoggerPro.exe
